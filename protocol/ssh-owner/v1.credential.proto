syntax = "proto3";

package bigbud.ssh_owner.v1;

// In-app SSH password and key-passphrase entry through the owner
// (Request 190–193, Reply 106–107, ErrorCode 79–81).
//
// The secret never crosses a frame, a grant digest, argv or an environment
// variable of any process. The flow is:
//
//   1. `inspect_credential` (190, no operands) reports what this exact target
//      needs: nothing, a login password (descriptor `TARGET_AUTH_MODE_PASSWORD`,
//      POSIX owners only; U3 keeps Windows key-only) or the passphrase of its
//      encrypted identity file, and whether the target's credential master is
//      already unlocked.
//   2. `credential_unlock_open` (191) names the lease token and the expected
//      kind. The owner makes a private 0700 directory holding one 0600 socket
//      and returns its path. The caller connects once and writes the secret
//      bytes (1..511, no NUL, CR or LF) and closes its write side.
//   3. `credential_unlock_commit` (192) makes the owner accept exactly one
//      same-uid connection on that socket within its deadline, read the secret
//      into a wiped buffer and remove the socket before anything else. It then
//      starts the target's master with `SSH_ASKPASS` pointing at the owner's own
//      image over a separate per-handshake askpass socket, releases the secret
//      once to the verified helper whose parent is that exact `ssh`, and wipes
//      it. The secret is never cached: a later master needs a new entry.
//   4. `credential_lock` (193) closes the target's credential master.
//
// Keyboard-interactive stays a typed refusal (U2): the master offers only
// `password` or `publickey`, never `keyboard-interactive`. Each target allows
// at most three rejected attempts per owner generation of that target;
// further commits answer `credential_attempts_exhausted` until Connect or
// Disconnect rotates the generation.
//
// While the master is unlocked, every other lease of the target multiplexes
// over it (`ControlMaster=no` with the owner's control path); without it a
// credential target refuses every spawn with `credential_required` before any
// SSH process starts.

enum CredentialKind {
  CREDENTIAL_KIND_UNSPECIFIED = 0;
  CREDENTIAL_KIND_NONE = 1;
  CREDENTIAL_KIND_PASSWORD = 2;
  CREDENTIAL_KIND_KEY_PASSPHRASE = 3;
}

message InspectCredential {}

message CredentialUnlockOpen {
  bytes lease = 1;
  CredentialKind kind = 2;
}

message CredentialUnlockCommit {
  bytes lease = 1;
}

message CredentialLock {}

// Reply 106.
message CredentialState {
  CredentialKind kind = 1;
  bool unlocked = 2;
  uint32 attempts_remaining = 3;
  // For a key passphrase, the identity file the prompt names (the path the
  // descriptor already carried). Empty otherwise.
  string identity = 4;
}

// Reply 107.
message CredentialUnlockLease {
  bytes lease = 1;
  string socket_path = 2;
}
