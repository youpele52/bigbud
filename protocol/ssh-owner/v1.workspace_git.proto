syntax = "proto3";
package bigbud.ssh_owner.v1;

// Fixed read-only recipes; do not add arbitrary Git arguments here.
message ProofWorkspaceGit {
  string workspace_root = 1;
  ProofWorkspaceGitAction action = 2;
  // Validated repository-relative operands for the fixed mutation recipes only.
  repeated string paths = 3;
  // History recipes (actions 20-25) only: a full or abbreviated lowercase hex
  // commit (summary, numstat, file diff) or an upstream ref name (unpushed).
  string revision = 4;
  // COMMIT_LOG page size (1-101) and offset (0-1000000).
  uint32 limit = 5;
  uint32 skip = 6;
  // COMMIT_FILE_DIFF byte cap (1-1000000); output past it is cut and flagged.
  uint32 max_output_bytes = 7;
  // Actions 26-74 only: the typed slot values of that action's fixed argv
  // template, in order (refs, `<ref>..HEAD`, messages, repository-relative
  // paths, a worktree directory beside the workspace root). See
  // transport/workspace/git.templates.rs.
  repeated string operands = 8;
}

enum ProofWorkspaceGitAction {
  reserved 127;
  PROOF_WORKSPACE_GIT_ACTION_UNSPECIFIED = 0;
  PROOF_WORKSPACE_GIT_ACTION_STATUS_PORCELAIN_V2 = 1;
  PROOF_WORKSPACE_GIT_ACTION_IS_INSIDE_WORK_TREE = 2;
  PROOF_WORKSPACE_GIT_ACTION_STAGED_NUMSTAT = 3;
  PROOF_WORKSPACE_GIT_ACTION_UNSTAGED_NUMSTAT = 4;
  PROOF_WORKSPACE_GIT_ACTION_ORIGIN_DEFAULT_REF = 5;
  PROOF_WORKSPACE_GIT_ACTION_ORIGIN_REMOTE_URL = 6;
  PROOF_WORKSPACE_GIT_ACTION_STATUS_PORCELAIN_V2_NUL = 7;
  PROOF_WORKSPACE_GIT_ACTION_SHOW_TOPLEVEL = 8;
  PROOF_WORKSPACE_GIT_ACTION_RESTORE_TRACKED_PATHS = 9;
  PROOF_WORKSPACE_GIT_ACTION_CLEAN_UNTRACKED_PATHS = 10;
  PROOF_WORKSPACE_GIT_ACTION_STAGE_PATHS = 11;
  PROOF_WORKSPACE_GIT_ACTION_UNTRACKED_NUMSTAT = 12;
  // Production read recipes for the diff panel and branch list (C06, B).
  // Diff recipes take zero or one repository-relative path; the untracked
  // file diff takes exactly one. Production admits this verb under the
  // request's own workspace root (root authority) with a tolerant, still
  // fail-closed local-config allowlist; see transport/workspace/git.guard.rs.
  PROOF_WORKSPACE_GIT_ACTION_DIFF_STATUS = 13;
  PROOF_WORKSPACE_GIT_ACTION_HAS_HEAD = 14;
  PROOF_WORKSPACE_GIT_ACTION_DIFF_AGAINST_HEAD = 15;
  PROOF_WORKSPACE_GIT_ACTION_DIFF_STAGED = 16;
  PROOF_WORKSPACE_GIT_ACTION_DIFF_UNSTAGED = 17;
  PROOF_WORKSPACE_GIT_ACTION_UNTRACKED_FILE_DIFF = 18;
  PROOF_WORKSPACE_GIT_ACTION_LOCAL_BRANCHES = 19;
  // History panel (B): commit list, unpushed marks, one commit's summary and
  // changed files (NUL numstat), and one file's patch with a byte cap.
  PROOF_WORKSPACE_GIT_ACTION_COMMIT_LOG = 20;
  PROOF_WORKSPACE_GIT_ACTION_UPSTREAM_REF = 21;
  PROOF_WORKSPACE_GIT_ACTION_UNPUSHED_SHAS = 22;
  PROOF_WORKSPACE_GIT_ACTION_COMMIT_SUMMARY = 23;
  PROOF_WORKSPACE_GIT_ACTION_COMMIT_NUMSTAT = 24;
  PROOF_WORKSPACE_GIT_ACTION_COMMIT_FILE_DIFF = 25;
  // Branch, checkout, commit (repository hooks run), worktree and range
  // recipes; operands in `operands`. Reads 26-42, mutations 43-58.
  PROOF_WORKSPACE_GIT_ACTION_SHOW_REF_HEAD = 26;
  PROOF_WORKSPACE_GIT_ACTION_SHOW_REF_REMOTE = 27;
  PROOF_WORKSPACE_GIT_ACTION_TRACKING_REFS = 28;
  PROOF_WORKSPACE_GIT_ACTION_CURRENT_BRANCH = 29;
  PROOF_WORKSPACE_GIT_ACTION_ORIGIN_HEAD_SHORT = 30;
  PROOF_WORKSPACE_GIT_ACTION_WORKTREE_LIST = 31;
  PROOF_WORKSPACE_GIT_ACTION_LOCAL_BRANCH_LIST = 32;
  PROOF_WORKSPACE_GIT_ACTION_REMOTE_BRANCH_LIST = 33;
  PROOF_WORKSPACE_GIT_ACTION_REMOTE_NAMES = 34;
  PROOF_WORKSPACE_GIT_ACTION_REMOTE_URLS = 35;
  PROOF_WORKSPACE_GIT_ACTION_BRANCH_METADATA = 36;
  PROOF_WORKSPACE_GIT_ACTION_RANGE_LOG = 37;
  PROOF_WORKSPACE_GIT_ACTION_RANGE_DIFF_STAT = 38;
  PROOF_WORKSPACE_GIT_ACTION_RANGE_DIFF_PATCH = 39;
  PROOF_WORKSPACE_GIT_ACTION_STAGED_SUMMARY = 40;
  PROOF_WORKSPACE_GIT_ACTION_STAGED_PATCH = 41;
  PROOF_WORKSPACE_GIT_ACTION_REV_PARSE_HEAD = 42;
  PROOF_WORKSPACE_GIT_ACTION_RESET_INDEX = 43;
  PROOF_WORKSPACE_GIT_ACTION_ADD_ALL = 44;
  PROOF_WORKSPACE_GIT_ACTION_ADD_SELECTED = 45;
  PROOF_WORKSPACE_GIT_ACTION_COMMIT = 46;
  PROOF_WORKSPACE_GIT_ACTION_COMMIT_WITH_BODY = 47;
  PROOF_WORKSPACE_GIT_ACTION_CHECKOUT = 48;
  PROOF_WORKSPACE_GIT_ACTION_CHECKOUT_TRACK = 49;
  PROOF_WORKSPACE_GIT_ACTION_BRANCH_CREATE = 50;
  PROOF_WORKSPACE_GIT_ACTION_BRANCH_RENAME_CURRENT = 51;
  PROOF_WORKSPACE_GIT_ACTION_BRANCH_RENAME = 52;
  PROOF_WORKSPACE_GIT_ACTION_BRANCH_DELETE = 53;
  PROOF_WORKSPACE_GIT_ACTION_SET_UPSTREAM = 54;
  PROOF_WORKSPACE_GIT_ACTION_WORKTREE_ADD = 55;
  PROOF_WORKSPACE_GIT_ACTION_WORKTREE_ADD_NEW_BRANCH = 56;
  PROOF_WORKSPACE_GIT_ACTION_WORKTREE_REMOVE = 57;
  PROOF_WORKSPACE_GIT_ACTION_WORKTREE_REMOVE_FORCE = 58;
  PROOF_WORKSPACE_GIT_ACTION_ORIGIN_HEAD_REF = 59;
  // Force delete of the named branch, new branches, stash, init, remote add
  // and worktree creation at a fixed commit (operands typed per action).
  PROOF_WORKSPACE_GIT_ACTION_BRANCH_FORCE_DELETE = 60;
  PROOF_WORKSPACE_GIT_ACTION_CHECKOUT_NEW_BRANCH = 61;
  PROOF_WORKSPACE_GIT_ACTION_CHECKOUT_NEW_BRANCH_FROM = 62;
  PROOF_WORKSPACE_GIT_ACTION_STASH_PUSH = 63;
  PROOF_WORKSPACE_GIT_ACTION_STASH_PUSH_MESSAGE = 64;
  PROOF_WORKSPACE_GIT_ACTION_STASH_POP = 65;
  PROOF_WORKSPACE_GIT_ACTION_STASH_POP_REF = 66;
  PROOF_WORKSPACE_GIT_ACTION_STASH_APPLY = 67;
  PROOF_WORKSPACE_GIT_ACTION_STASH_APPLY_REF = 68;
  PROOF_WORKSPACE_GIT_ACTION_STASH_LIST = 69;
  PROOF_WORKSPACE_GIT_ACTION_STASH_DROP = 70;
  PROOF_WORKSPACE_GIT_ACTION_STASH_DROP_REF = 71;
  PROOF_WORKSPACE_GIT_ACTION_INIT = 72;
  PROOF_WORKSPACE_GIT_ACTION_REMOTE_ADD = 73;
  PROOF_WORKSPACE_GIT_ACTION_WORKTREE_ADD_NEW_BRANCH_AT = 74;
}

message ProofWorkspaceGitResult {
  optional int32 code = 1;
  string stdout = 2;
  string stderr = 3;
  // Additive: an ambiguous mutation outcome is explicit instead of inferred from a missing exit.
  ProofWorkspaceGitOutcome outcome = 4;
  // COMMIT_FILE_DIFF only: stdout was cut at max_output_bytes.
  bool stdout_truncated = 5;
}

enum ProofWorkspaceGitOutcome {
  PROOF_WORKSPACE_GIT_OUTCOME_UNSPECIFIED = 0;
  PROOF_WORKSPACE_GIT_OUTCOME_EXITED = 1;
  PROOF_WORKSPACE_GIT_OUTCOME_CANCELLED = 2;
  PROOF_WORKSPACE_GIT_OUTCOME_OUTCOME_UNKNOWN = 3;
}

// One destination only in the fixture. Bind all inputs to the trusted startup
// approval and current owner generation before starting either child.
message ProofGitTrackedPush {
  ProofGitPushRepository repository = 1;
  string remote_name = 2;
  string source_ref = 3;
  string destination_ref = 4;
  string source_oid = 5;
  ProofGitPushDestination destination = 6;
  uint32 timeout_ms = 7;
}

message ProofGitPushRepository {
  string worktree = 1;
  string git_dir = 2;
  string common_dir = 3;
}

message ProofGitPushDestination {
  string effective_url = 1;
  string execution_target_id = 2;
  bytes target_generation = 3;
  string host = 4;
  string user = 5;
  uint32 port = 6;
  string repository_path = 7;
  string expected_old_oid = 8;
}

message ProofGitTrackedPushReceipt {
  ProofGitTrackedPushStatus status = 1;
}

enum ProofGitTrackedPushStatus {
  PROOF_GIT_TRACKED_PUSH_STATUS_UNSPECIFIED = 0;
  PROOF_GIT_TRACKED_PUSH_STATUS_DENIED_BEFORE_DISPATCH = 1;
  PROOF_GIT_TRACKED_PUSH_STATUS_ACCEPTED = 2;
  PROOF_GIT_TRACKED_PUSH_STATUS_UNCHANGED = 3;
  PROOF_GIT_TRACKED_PUSH_STATUS_REJECTED = 4;
  PROOF_GIT_TRACKED_PUSH_STATUS_UNCONFIRMED = 5;
}

// U15 production Git upload lease (fetch, pull and PR fetch for remotes on a
// bigbud SSH target). The owner validates `repository_path` as absolute,
// normalized and inside `workspace_root` (itself absolute, normalized and not
// `/`), re-checks the containment on the target after resolving symlinks, and
// runs only `git-upload-pack` under a fixed environment. The byte channel is a
// private owner-created Unix socket that admits exactly one connection; no
// request names a command, argument or environment. Push uses the separate
// GitReceive lease below.
//
// Bounds: lease 32 bytes; each path 1..1024 bytes, no NUL or control bytes.
message GitUploadOpen {
  bytes lease = 1;
  string workspace_root = 2;
  string repository_path = 3;
}

message GitUploadLease {
  bytes lease = 1;
}

message GitUploadState {
  bytes lease = 1;
  GitUploadPhase phase = 2;
  // Present only while LISTENING: the owner socket for this lease.
  optional string socket_path = 3;
  optional uint32 exit_code = 4;
}

enum GitUploadPhase {
  GIT_UPLOAD_PHASE_UNSPECIFIED = 0;
  GIT_UPLOAD_PHASE_LISTENING = 1;
  GIT_UPLOAD_PHASE_STREAMING = 2;
  GIT_UPLOAD_PHASE_EXITED = 3;
  GIT_UPLOAD_PHASE_CLOSED = 4;
  GIT_UPLOAD_PHASE_LOST = 5;
  GIT_UPLOAD_PHASE_REJECTED = 6;
  GIT_UPLOAD_PHASE_UNCONFIRMED = 7;
}

// U15 production Git receive lease (push to a remote on a bigbud SSH target).
// Same path authority, guard, pinned channel and socket as GitUpload. The owner
// sits between the socket and `git-receive-pack`: it reads the live
// advertisement, settles STALE unless `destination_ref` is advertised at
// `expected_old_oid`, gives local Git a single-ref advertisement with narrowed
// capabilities, and forwards exactly one command
// `<expected_old_oid> <source_oid> <destination_ref>` and its pack. The remote
// runs with receive.denyNonFastForwards and receive.denyDeletes forced on.
// An all-zero `expected_old_oid` is a first publish (U15): the ref must be
// absent from the live advertisement (present settles STALE), local Git sees
// only `capabilities^{}` plus live tips as `.have`, and only
// `<zero> <source_oid> <destination_ref>` is forwarded. Deletion, other refs
// and extra commands are never forwarded.
//
// Bounds: lease 32 bytes; each path 1..1024 bytes, no NUL or control bytes;
// destination_ref `refs/heads/...` at most 255 bytes; both OIDs 40 or 64
// lowercase hex of one width; source nonzero; old nonzero or all zeros.
message GitReceiveOpen {
  bytes lease = 1;
  string workspace_root = 2;
  string repository_path = 3;
  string destination_ref = 4;
  string expected_old_oid = 5;
  string source_oid = 6;
}

message GitReceiveLease {
  bytes lease = 1;
}

message GitReceiveState {
  bytes lease = 1;
  GitReceivePhase phase = 2;
  // Present only while LISTENING: the owner socket for this lease.
  optional string socket_path = 3;
  // Set only when FINISHED.
  GitReceiveReceipt receipt = 4;
}

enum GitReceivePhase {
  GIT_RECEIVE_PHASE_UNSPECIFIED = 0;
  GIT_RECEIVE_PHASE_LISTENING = 1;
  GIT_RECEIVE_PHASE_STREAMING = 2;
  // Settled with a receipt; ACCEPTED or REJECTED come from a complete report.
  GIT_RECEIVE_PHASE_FINISHED = 3;
  // Closed or cancelled before any update was forwarded.
  GIT_RECEIVE_PHASE_CLOSED = 4;
  // The transport failed before any update was forwarded.
  GIT_RECEIVE_PHASE_LOST = 5;
  // The target guard refused the repository before receive-pack ran.
  GIT_RECEIVE_PHASE_REJECTED = 6;
  // An update may have been forwarded; never replay.
  GIT_RECEIVE_PHASE_UNCONFIRMED = 7;
}

enum GitReceiveReceipt {
  GIT_RECEIVE_RECEIPT_UNSPECIFIED = 0;
  GIT_RECEIVE_RECEIPT_ACCEPTED = 1;
  // expected_old_oid == source_oid and the live ref matched; nothing written.
  GIT_RECEIVE_RECEIPT_UNCHANGED = 2;
  // receive-pack reported `ng` for the ref (for example non-fast-forward).
  GIT_RECEIVE_RECEIPT_REJECTED = 3;
  // The live ref differs from expected_old_oid (absent for an update, present
  // for a first publish); nothing forwarded.
  GIT_RECEIVE_RECEIPT_STALE = 4;
  // Local Git's command or capabilities deviated from the approval; nothing
  // forwarded.
  GIT_RECEIVE_RECEIPT_REFUSED = 5;
}
