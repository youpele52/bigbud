syntax = "proto3";

package bigbud.remote_agent.v1;

message WorkspaceOpenRequest {
  string request_id = 1;
  string workspace_handle = 2;
  string root = 3;
}

message WorkspaceOpenResponse {
  string request_id = 1;
  string workspace_handle = 2;
  bool accepted = 3;
  string error_code = 4;
  string error_message = 5;
}

message ReadFileRequest {
  string request_id = 1;
  string operation_id = 2;
  bytes request_digest = 3;
  string workspace_handle = 4;
  string path = 5;
  uint64 offset = 6;
  uint64 max_bytes = 7;
}

message ReadFileResponse {
  string request_id = 1;
  string operation_id = 2;
  bool terminal = 3;
  bytes bytes = 4;
  uint64 total_bytes = 5;
  bool truncated = 6;
  string error_code = 7;
  string error_message = 8;
}

message ListDirectoryRequest {
  string request_id = 1;
  string operation_id = 2;
  bytes request_digest = 3;
  string workspace_handle = 4;
  string path = 5;
}

message DirectoryEntry {
  string path = 1;
  bool is_directory = 2;
  bool is_file = 3;
  uint64 size_bytes = 4;
  uint64 modified_unix_ms = 5;
}

message ListDirectoryResponse {
  string request_id = 1;
  string operation_id = 2;
  bool terminal = 3;
  repeated DirectoryEntry entries = 4;
  string error_code = 5;
  string error_message = 6;
}

message FilenameSearchRequest {
  string request_id = 1;
  string operation_id = 2;
  bytes request_digest = 3;
  string workspace_handle = 4;
  string path = 5;
  string query = 6;
  uint32 max_results = 7;
}

message FilenameSearchResponse {
  string request_id = 1;
  string operation_id = 2;
  bool terminal = 3;
  repeated DirectoryEntry entries = 4;
  bool truncated = 5;
  string error_code = 6;
  string error_message = 7;
}

message ContentSearchRequest {
  string request_id = 1;
  string operation_id = 2;
  bytes request_digest = 3;
  string workspace_handle = 4;
  string path = 5;
  string query = 6;
  uint32 max_results = 7;
}

message ContentMatch {
  string path = 1;
  uint32 line = 2;
  uint32 column = 3;
  string excerpt = 4;
}

message ContentSearchResponse {
  string request_id = 1;
  string operation_id = 2;
  bool terminal = 3;
  repeated ContentMatch matches = 4;
  bool truncated = 5;
  string error_code = 6;
  string error_message = 7;
}

message WriteFileRequest {
  string request_id = 1;
  string operation_id = 2;
  bytes request_digest = 3;
  string workspace_handle = 4;
  string path = 5;
  bytes bytes = 6;
  string expected_sha256 = 7;
  // Exclusive create (capability `workspace.write-create-only`): an existing entry, including a
  // symlink, is left untouched and fails with ALREADY_EXISTS. Never combined with expected_sha256.
  bool create_only = 8;
}

message WriteFileResponse {
  string request_id = 1;
  string operation_id = 2;
  bool terminal = 3;
  uint64 written_bytes = 4;
  string error_code = 5;
  string error_message = 6;
  string current_sha256 = 7;
}

// Receipt query (`workspace.write` 1.2): whether this agent applied the guarded write identified by
// operation_id and request_digest. It never performs or retries a write. "Not applied" is not
// definitive: a write frame from a lost connection may still be processed.
message WriteReceiptRequest {
  string request_id = 1;
  string operation_id = 2;
  bytes request_digest = 3;
}

message WriteReceiptResponse {
  string request_id = 1;
  string operation_id = 2;
  // True only when this agent recorded a successful write for the identity.
  bool applied = 3;
  // Lowercase hex SHA-256 of the bytes written; set when applied.
  string result_sha256 = 4;
  // OPERATION_ID_CONFLICT when the identity was accepted with a different request digest.
  string error_code = 5;
  string error_message = 6;
}

// Create one folder (capability `workspace.mkdir` 1.0). The parent must already exist; every
// component is opened without following symlinks. An existing entry fails with ALREADY_EXISTS.
message CreateDirectoryRequest {
  string request_id = 1;
  string operation_id = 2;
  bytes request_digest = 3;
  string workspace_handle = 4;
  string path = 5;
}

message CreateDirectoryResponse {
  string request_id = 1;
  string operation_id = 2;
  bool terminal = 3;
  string error_code = 4;
  string error_message = 5;
}

// Permanently delete one entry (capability `workspace.delete` 1.0). The workspace root is refused
// (ROOT_ENTRY). A symlink is removed as a link and never followed. A real directory is removed
// recursively without crossing symlinks, after a bounded count pass (DELETE_LIMIT_EXCEEDED, with
// nothing removed). expected_kind is "file" or "directory"; a different real entry is refused
// (KIND_MISMATCH). A failure after removal started reports UNKNOWN_OUTCOME.
message DeleteEntryRequest {
  string request_id = 1;
  string operation_id = 2;
  bytes request_digest = 3;
  string workspace_handle = 4;
  string path = 5;
  string expected_kind = 6;
}

message DeleteEntryResponse {
  string request_id = 1;
  string operation_id = 2;
  bool terminal = 3;
  string error_code = 4;
  string error_message = 5;
  // "file", "directory" or "symlink" on success.
  string deleted_kind = 6;
}

message WorkspaceWatchStartRequest {
  string request_id = 1;
  string subscription_id = 2;
  string workspace_handle = 3;
  string path = 4;
}

message WorkspaceWatchStartResponse {
  string request_id = 1;
  string subscription_id = 2;
  bool accepted = 3;
  uint64 generation = 4;
  string backend = 5;
  string error_code = 6;
  string error_message = 7;
}

message WorkspaceChange {
  string path = 1;
  string kind = 2;
}

message WorkspaceWatchEvent {
  string subscription_id = 1;
  uint64 generation = 2;
  uint64 sequence = 3;
  repeated WorkspaceChange changes = 4;
  bool rescan_required = 5;
  string rescan_reason = 6;
  string backend = 7;
}

message WorkspaceWatchStopRequest {
  string request_id = 1;
  string subscription_id = 2;
}

message WorkspaceWatchStopResponse {
  string request_id = 1;
  string subscription_id = 2;
  bool stopped = 3;
}
