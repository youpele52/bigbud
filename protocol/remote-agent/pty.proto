syntax = "proto3";

package bigbud.remote_agent.v1;

import "remote-agent/process.proto";

message PtyCreateRequest {
  string request_id = 1;
  string pty_id = 2;
  bytes request_digest = 3;
  string workspace_handle = 4;
  string cwd = 5;
  string shell = 6;
  repeated string args = 7;
  uint32 cols = 8;
  uint32 rows = 9;
  repeated ProcessEnvironment environment = 10;
  // Added in 1.5. Requires terminal.shell-profiles v1; validates exact profile
  // executable/argv before admission. False retains unrestricted legacy PTYs.
  bool profile_launch = 11;
}

message PtyCreateResponse {
  string request_id = 1;
  string pty_id = 2;
  bool accepted = 3;
  uint64 pid = 4;
  string error_code = 5;
  string error_message = 6;
  // Added in 1.4. Empty means unknown; "unconfirmed" is not exec confirmation.
  string launch_status = 7;
}

message PtyInput {
  string request_id = 1;
  string pty_id = 2;
  uint64 sequence = 3;
  bytes bytes = 4;
}

message PtyOutput {
  string pty_id = 1;
  uint64 sequence = 2;
  bytes bytes = 3;
}

message PtyOutputAck {
  string request_id = 1;
  string pty_id = 2;
  uint64 acknowledged_sequence = 3;
}

message PtyResizeRequest {
  string request_id = 1;
  string pty_id = 2;
  uint32 cols = 3;
  uint32 rows = 4;
}

message PtyResizeResponse {
  string request_id = 1;
  string pty_id = 2;
  bool accepted = 3;
  string error_code = 4;
  string error_message = 5;
}

message PtySignalRequest {
  string request_id = 1;
  string pty_id = 2;
  string signal = 3;
}

message PtySignalResponse {
  string request_id = 1;
  string pty_id = 2;
  bool accepted = 3;
  string error_code = 4;
  string error_message = 5;
}

message PtyAttachRequest {
  string request_id = 1;
  string pty_id = 2;
  uint64 after_sequence = 3;
}

message PtyAttachResponse {
  string request_id = 1;
  string pty_id = 2;
  string state = 3;
  uint64 pid = 4;
  uint64 next_sequence = 5;
  uint64 first_retained_sequence = 6;
  bool replay_gap = 7;
  // Retained launch evidence, independent of current PTY state or PID.
  string launch_status = 8;
}

message PtyCloseRequest {
  string request_id = 1;
  string pty_id = 2;
  bool terminate = 3;
}

message PtyCloseResponse {
  string request_id = 1;
  string pty_id = 2;
  bool accepted = 3;
  string error_code = 4;
  string error_message = 5;
}

message PtyExited {
  string pty_id = 1;
  int32 exit_code = 2;
  bool has_exit_code = 3;
  int32 signal = 4;
  bool has_signal = 5;
}

message PtyInputResponse {
  string request_id = 1;
  string pty_id = 2;
  bool accepted = 3;
  string error_code = 4;
  string error_message = 5;
}

// Added in 1.7; requires terminal.pty-input-reconcile v1. This may atomically
// retire the next never-admitted sequence WITHOUT writing any input bytes.
message PtyInputReconcileRequest {
  string request_id = 1;
  string expected_epoch = 2;
  string pty_id = 3;
  bytes create_digest = 4;
  uint64 sequence = 5;
  bytes payload_digest = 6;
  uint64 byte_length = 7;
}

message PtyInputReconcileResponse {
  string request_id = 1;
  string agent_epoch = 2;
  string pty_id = 3;
  bytes create_digest = 4;
  uint64 sequence = 5;
  bytes payload_digest = 6;
  uint64 byte_length = 7;
  // accepted, writing, written, failed-before-write, partial-unknown, not-admitted.
  // Empty/unknown values confer no input authority. Written is PTY syscall delivery,
  // not shell execution. Native writability is a separate observation.
  string outcome = 8;
  uint64 bytes_written = 9;
  bool writer_usable = 10;
  bool accepted = 11;
  string error_code = 12;
}

message PtyOutputAckResponse {
  string request_id = 1;
  string pty_id = 2;
  bool accepted = 3;
  string error_code = 4;
  string error_message = 5;
}

// Added in 1.6; requires terminal.pty-inventory v1. Read-only live inventory.
message PtyListRequest {
  string request_id = 1;
  string expected_epoch = 2;
  string after_pty_id = 3;
  uint32 limit = 4;
  // Membership fingerprint from the preceding page; empty starts a new scan.
  string snapshot_id = 5;
}
message PtyInventoryEntry {
  string pty_id = 1;
  bytes request_digest = 2;
  string state = 3;
  uint64 pid = 4;
  uint64 next_sequence = 5;
  uint64 first_retained_sequence = 6;
  bool verified_exit = 7;
  string launch_status = 8;
}
message PtyListResponse {
  string request_id = 1;
  string agent_epoch = 2;
  repeated PtyInventoryEntry entries = 3;
  string next_after_pty_id = 4;
  string snapshot_id = 5;
  bool accepted = 6;
  string error_code = 7;
}

// Removes only this connection's subscription, leaving the PTY and retention intact.
message PtyDetachRequest { string request_id = 1; string pty_id = 2; }
message PtyDetachResponse {
  string request_id = 1;
  string pty_id = 2;
  bool accepted = 3;
  string error_code = 4;
  string error_message = 5;
}
