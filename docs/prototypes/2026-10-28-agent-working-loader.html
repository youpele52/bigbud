<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bigbud · agent working loader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Theme tokens mirrored from apps/web/src/index.css */
      :root {
        color-scheme: light;
        --background: #fafafa;
        --foreground: #171717;
        --card: #ffffff;
        --muted-foreground: #46464b;
        --border: rgb(0 0 0 / 8%);
        --info: #3b82f6;
        --info-foreground: #1d4ed8;
        --success: #10b981;
        --track: rgb(0 0 0 / 6%);
        --card-surface-radius: 20px;
      }
      .dark {
        color-scheme: dark;
        --background: #0f0f0f;
        --foreground: #f5f5f5;
        --card: #141414;
        --muted-foreground: #8a8a8a;
        --border: rgb(255 255 255 / 6%);
        --info: #3b82f6;
        --info-foreground: #60a5fa;
        --success: #10b981;
        --track: rgb(255 255 255 / 7%);
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--background);
        color: var(--foreground);
        font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        font-size: 14px;
        display: grid;
        place-items: center;
        transition:
          background 0.3s,
          color 0.3s;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.035;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-size: 256px 256px;
      }

      main {
        width: min(560px, calc(100vw - 32px));
        display: grid;
        gap: 16px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 0;
      }
      .caption {
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--card-surface-radius);
        padding: 20px;
      }
      button {
        font: inherit;
        font-size: 14px;
        color: var(--foreground);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button:hover {
        background: var(--track);
      }
      .controls {
        display: flex;
        gap: 8px;
      }

      /* ---------- The loader ---------- */
      .agent-loader {
        --size: 22px;
        --tone: var(--info);
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      .agent-loader[data-state="done"] {
        --tone: var(--success);
      }

      .orb {
        position: relative;
        width: var(--size);
        height: var(--size);
        flex: none;
      }
      /* soft glow that breathes behind everything */
      .orb::before {
        content: "";
        position: absolute;
        inset: -40%;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          color-mix(in srgb, var(--tone) 35%, transparent),
          transparent 65%
        );
        animation: glow 2.4s ease-in-out infinite;
      }
      /* faint track ring */
      .orb::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1.5px solid var(--track);
      }
      /* comet arc: a conic gradient masked to a ring, so the tail fades out */
      .arc {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0turn, var(--tone) 0.32turn, transparent 0.33turn);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
        animation: spin 1.1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      }
      /* the comet head */
      .head {
        position: absolute;
        inset: 0;
        animation: spin 1.1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      }
      .head::before {
        content: "";
        position: absolute;
        top: -1px;
        left: 50%;
        width: 3.5px;
        height: 3.5px;
        margin-left: -1.75px;
        border-radius: 50%;
        background: var(--tone);
        box-shadow: 0 0 6px var(--tone);
        transform: rotate(0.33turn) translateY(0);
        transform-origin: 50% calc(var(--size) / 2 + 1px);
      }
      /* the core: the "agent" thinking */
      .core {
        position: absolute;
        inset: 32%;
        border-radius: 50%;
        background: var(--foreground);
        animation: core 2.4s ease-in-out infinite;
      }

      .agent-loader[data-state="done"] .arc,
      .agent-loader[data-state="done"] .head {
        animation: none;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .agent-loader[data-state="done"] .orb::after {
        border-color: var(--tone);
        transition: border-color 0.3s;
      }
      .agent-loader[data-state="done"] .core {
        animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        background: var(--tone);
      }
      .agent-loader[data-state="done"] .orb::before {
        animation: none;
        opacity: 0.6;
      }

      /* label: shimmering verb + elapsed time */
      .label {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        white-space: nowrap;
      }
      .verb-slot {
        position: relative;
        display: inline-grid;
        overflow: hidden;
        height: 1.4em;
        line-height: 1.4em;
        font-weight: 500;
      }
      .verb {
        grid-area: 1 / 1;
        color: transparent;
        background: linear-gradient(
            90deg,
            var(--muted-foreground) 0%,
            var(--muted-foreground) 40%,
            var(--foreground) 50%,
            var(--muted-foreground) 60%,
            var(--muted-foreground) 100%
          )
          0 0 / 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        animation: shimmer 2.2s linear infinite;
        transition:
          transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.45s,
          filter 0.45s;
      }
      .verb.enter {
        transform: translateY(100%);
        opacity: 0;
        filter: blur(3px);
      }
      .verb.leave {
        transform: translateY(-100%);
        opacity: 0;
        filter: blur(3px);
      }
      .agent-loader[data-state="done"] .verb {
        animation: none;
        background: none;
        color: var(--foreground);
      }
      .word {
        display: inline-flex;
        align-items: baseline;
      }
      .dots::after {
        content: "";
        display: inline-block;
        width: 1.2em;
        text-align: left;
        color: var(--muted-foreground);
        animation: dots 1.4s steps(4, end) infinite;
      }
      .agent-loader[data-state="done"] .dots {
        display: none;
      }
      .elapsed {
        font-size: 12px;
        color: var(--muted-foreground);
        font-variant-numeric: tabular-nums;
      }

      /* sizes */
      .agent-loader.lg {
        --size: 44px;
        gap: 14px;
      }
      .agent-loader.lg .verb-slot {
        font-size: 16px;
      }

      @keyframes spin {
        to {
          transform: rotate(1turn);
        }
      }
      @keyframes glow {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.85);
        }
        50% {
          opacity: 0.9;
          transform: scale(1.05);
        }
      }
      @keyframes core {
        0%,
        100% {
          transform: scale(0.7);
          opacity: 0.55;
        }
        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes pop {
        0% {
          transform: scale(0.6);
        }
        100% {
          transform: scale(1.15);
          opacity: 1;
        }
      }
      @keyframes shimmer {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: -50% 0;
        }
      }
      @keyframes dots {
        0% {
          content: "";
        }
        25% {
          content: ".";
        }
        50% {
          content: "..";
        }
        75% {
          content: "...";
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .arc,
        .head,
        .core,
        .orb::before,
        .verb,
        .dots::after {
          animation: none !important;
        }
        .arc {
          transform: rotate(0.2turn);
        }
        .verb {
          background: none;
          color: var(--muted-foreground);
          transition: none;
        }
      }

      /* timeline context mock */
      .row {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .bubble {
        margin-left: auto;
        max-width: 80%;
        background: var(--track);
        border-radius: 14px;
        padding: 8px 12px;
      }
      .divider {
        height: 1px;
        background: var(--border);
        margin: 16px 0;
      }
      .stage {
        display: grid;
        place-items: center;
        padding: 28px 0 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Agent working loader</h1>
          <div class="caption">Prototype · bigbud theme tokens · respects reduced motion</div>
        </div>
        <div class="controls">
          <button id="toggle-done" type="button">Finish</button>
          <button id="toggle-theme" type="button">Light</button>
        </div>
      </header>

      <section class="card">
        <div class="caption">Hero</div>
        <div class="stage">
          <div class="agent-loader lg" data-loader role="status" aria-live="polite">
            <span class="orb" aria-hidden="true"><span class="arc"></span><span class="head"></span><span class="core"></span></span>
            <span class="label">
              <span class="word"><span class="verb-slot"><span class="verb">Thinking</span></span><span class="dots" aria-hidden="true"></span></span>
              <span class="elapsed">0s</span>
            </span>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="caption">In the timeline</div>
        <div class="divider"></div>
        <div class="row"><div class="bubble">Refactor the files panel loader and add retry on reconnect.</div></div>
        <div class="divider"></div>
        <div class="row">
          <div class="agent-loader" data-loader role="status" aria-live="polite">
            <span class="orb" aria-hidden="true"><span class="arc"></span><span class="head"></span><span class="core"></span></span>
            <span class="label">
              <span class="word"><span class="verb-slot"><span class="verb">Thinking</span></span><span class="dots" aria-hidden="true"></span></span>
              <span class="elapsed">0s</span>
            </span>
          </div>
        </div>
      </section>
    </main>

    <script>
      const VERBS = ["Thinking", "Reading files", "Planning", "Editing", "Running checks", "Reviewing"];
      const loaders = [...document.querySelectorAll("[data-loader]")];
      let start = performance.now();
      let index = 0;
      let done = false;

      function formatElapsed(ms) {
        const s = Math.floor(ms / 1000);
        return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s`;
      }

      function swapVerb(loader, text) {
        const slot = loader.querySelector(".verb-slot");
        const current = slot.querySelector(".verb:not(.leave)");
        const next = document.createElement("span");
        next.className = "verb enter";
        next.textContent = text;
        slot.style.width = `${Math.max(current.offsetWidth, measure(slot, text))}px`;
        slot.appendChild(next);
        requestAnimationFrame(() => {
          current.classList.add("leave");
          next.classList.remove("enter");
          slot.style.width = `${measure(slot, text)}px`;
        });
        setTimeout(() => current.remove(), 500);
      }

      function measure(slot, text) {
        const probe = document.createElement("span");
        probe.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap;font:inherit;font-weight:500";
        probe.textContent = text;
        slot.appendChild(probe);
        const width = probe.offsetWidth;
        probe.remove();
        return width;
      }

      setInterval(() => {
        if (done) return;
        index = (index + 1) % VERBS.length;
        loaders.forEach((l) => swapVerb(l, VERBS[index]));
      }, 2600);

      (function tick() {
        if (!done) {
          const text = formatElapsed(performance.now() - start);
          loaders.forEach((l) => (l.querySelector(".elapsed").textContent = text));
        }
        requestAnimationFrame(tick);
      })();

      document.getElementById("toggle-done").addEventListener("click", (e) => {
        done = !done;
        loaders.forEach((l) => {
          l.dataset.state = done ? "done" : "working";
          if (done) swapVerb(l, "Done");
        });
        if (!done) {
          start = performance.now();
          index = 0;
          loaders.forEach((l) => swapVerb(l, VERBS[0]));
        }
        e.currentTarget.textContent = done ? "Restart" : "Finish";
      });

      document.getElementById("toggle-theme").addEventListener("click", (e) => {
        const dark = document.documentElement.classList.toggle("dark");
        e.currentTarget.textContent = dark ? "Light" : "Dark";
      });
    </script>
  </body>
</html>
