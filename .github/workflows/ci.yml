name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Only pull requests cancel superseded runs. Every other run gets its own group, because GitHub
# also cancels a pending run in a shared group even when cancel-in-progress is false.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt_lint:
    name: Format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Designated writer of the Bun and Electron caches (main pushes only).
      - name: Setup Bun, Node and dependencies
        uses: ./.github/actions/setup-bigbud
        with:
          save-caches: "true"

      - name: Format
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun, Node and dependencies
        uses: ./.github/actions/setup-bigbud

      - name: Typecheck
        run: bun run typecheck

  rust:
    name: Rust format, lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust and protoc
        uses: ./.github/actions/setup-rust-native
        with:
          components: rustfmt, clippy

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Rust test
        run: cargo test --locked --workspace

      - name: Rust binary build
        run: cargo build --locked --workspace --release

  # The @bigbud/server build runs two `cargo build --release` commands, so Rust and protoc are required.
  build_desktop_pipeline:
    name: Build desktop pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun, Node and dependencies
        uses: ./.github/actions/setup-bigbud

      - name: Setup Rust and protoc
        uses: ./.github/actions/setup-rust-native

      - name: Build desktop pipeline
        run: bun run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.js
          grep -nE "desktopBridge|getWsUrl|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.js

  test_packages:
    name: Test packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun, Node and dependencies
        uses: ./.github/actions/setup-bigbud

      - name: Setup Rust and protoc
        uses: ./.github/actions/setup-rust-native

      # The same debug binaries `cargo test --workspace` left for the monolith's JS tests; without
      # them several desktop tests skip silently.
      - name: Prepare native test binaries
        run: cargo test --locked --workspace --no-run

      - name: Test packages
        run: bun run test:packages

  test_server_unit:
    name: Test server unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Unit files are guard-checked not to spawn processes, so no Rust binaries or Playwright.
      - name: Setup Bun, Node and dependencies
        uses: ./.github/actions/setup-bigbud

      - name: Create test report directory
        run: mkdir -p "$RUNNER_TEMP/server-test-reports"

      # Through Turbo (`test:server`), which keeps `^build` and strict env mode.
      - name: Test server unit
        run: >-
          bun run test:server --project=unit --reporter=default --reporter=json
          --outputFile.json="$RUNNER_TEMP/server-test-reports/unit.json"

      # overwrite: a re-run of this job replaces its report instead of failing the upload.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-test-report-unit
          path: ${{ runner.temp }}/server-test-reports/unit.json
          retention-days: 7
          overwrite: true

  test_server_integration:
    name: Test server integration ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with `--shard-count` in test_server_shard_coverage.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun, Node and dependencies
        uses: ./.github/actions/setup-bigbud

      - name: Setup Rust and protoc
        uses: ./.github/actions/setup-rust-native

      # Integration files spawn these debug binaries, and two build bigbud-remote-agent in beforeAll.
      - name: Prepare native test binaries
        run: cargo test --locked --workspace --no-run

      - id: playwright_version
        name: Resolve Playwright version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require(require.resolve('playwright/package.json', { paths: ['apps/server'] })).version")"
          if [[ -z "$version" || "$version" == undefined ]]; then
            echo "::error::Could not resolve the installed Playwright version"; exit 1
          fi
          echo "key=playwright-${{ runner.os }}-${{ runner.arch }}-$version" >> "$GITHUB_OUTPUT"

      - id: playwright_cache
        name: Restore Playwright browser cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright_version.outputs.key }}

      # Skips the browser download on a cache hit and still installs the system dependencies.
      - name: Install Playwright Chromium for server terminal browser tests
        run: bun run --cwd apps/server test:browser:install

      - name: Save Playwright browser cache
        if: matrix.shard == 1 && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.playwright_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright_version.outputs.key }}

      - name: Create test report directory
        run: mkdir -p "$RUNNER_TEMP/server-test-reports"

      # Through Turbo (`test:server`), which keeps `^build` and strict env mode. Each shard keeps the
      # integration project's fileParallelism: false.
      - name: Test server integration shard
        run: >-
          bun run test:server --project=integration
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --reporter=default --reporter=json
          --outputFile.json="$RUNNER_TEMP/server-test-reports/integration-${{ matrix.shard }}.json"

      # overwrite: "Re-run failed jobs" on one shard replaces its report instead of failing the upload.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-test-report-integration-${{ matrix.shard }}
          path: ${{ runner.temp }}/server-test-reports/integration-${{ matrix.shard }}.json
          retention-days: 7
          overwrite: true

  test_server_shard_coverage:
    name: Verify server test shard coverage
    needs: [test_server_unit, test_server_integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun, Node and dependencies
        uses: ./.github/actions/setup-bigbud

      - name: Download server test reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: server-test-report-*
          merge-multiple: true
          path: ${{ runner.temp }}/server-test-reports

      - name: List expected server test files
        run: bun run --cwd apps/server test:list-files --json="$RUNNER_TEMP/expected.json"

      - name: Verify every server test file ran exactly once
        run: >-
          bun run ci:verify-shard-coverage
          --expected "$RUNNER_TEMP/expected.json"
          --unit "$RUNNER_TEMP/server-test-reports/unit.json"
          --shards-dir "$RUNNER_TEMP/server-test-reports"
          --shard-count 8
          --package-dir apps/server

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: node scripts/bun-install-with-retry.ts

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

      - name: Validate bootstrap installer scripts
        run: node scripts/bootstrap-installer-smoke.ts

  bootstrap_installer_smoke:
    name: Bootstrap Installer Smoke
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate install.ps1 with mocked cmdlets
        shell: pwsh
        run: pwsh -File scripts/bootstrap-installer-smoke.ps1

  nsis_installer_scripts:
    name: Windows Installer Process Cleanup
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate installer process cleanup script
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/nsis-close-processes-smoke.ps1

  windows_cua_sweep:
    name: Windows CUA Sweep Native Helper
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate Windows CUA sweep native helper
        run: bun run --cwd apps/desktop vitest run src/backend/cuaDriver.windowsSweep.native.test.ts

  native_resource_cleanup:
    name: Native Resource Cleanup ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
          - label: macOS x64
            runner: macos-15-intel
          - label: Linux x64
            runner: ubuntu-24.04
          - label: Linux arm64
            runner: ubuntu-24.04-arm
          - label: Windows x64
            runner: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.95.0
      - name: Run native cleanup tests
        run: cargo test --locked --package bigbud-remote-agent resource_cleanup

  native_resource_cleanup_mount:
    name: Native Resource Cleanup Linux Mount Boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.95.0
      - name: Run privileged mount-boundary cleanup test
        run: cargo test --locked --package bigbud-remote-agent refuses_a_same_device_bind_mount_boundary -- --ignored

  # The single CI verdict (required check and release gate). Desktop preview builds are excluded on
  # purpose: they are unsigned previews and never gated a release. A skipped or cancelled need fails
  # the verdict, so no needed job may use continue-on-error.
  ci_passed:
    name: CI passed
    if: always()
    needs:
      - fmt_lint
      - typecheck
      - rust
      - build_desktop_pipeline
      - test_packages
      - test_server_unit
      - test_server_integration
      - test_server_shard_coverage
      - release_smoke
      - bootstrap_installer_smoke
      - nsis_installer_scripts
      - windows_cua_sweep
      - native_resource_cleanup
      - native_resource_cleanup_mount
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verdict job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          # Must list exactly the jobs in `needs`; an empty or partial needs object fails the check.
          EXPECTED_JOBS: >-
            fmt_lint
            typecheck
            rust
            build_desktop_pipeline
            test_packages
            test_server_unit
            test_server_integration
            test_server_shard_coverage
            release_smoke
            bootstrap_installer_smoke
            nsis_installer_scripts
            windows_cua_sweep
            native_resource_cleanup
            native_resource_cleanup_mount
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' $EXPECTED_JOBS | jq -R . | jq -cs 'sort')"
          {
            echo "### CI passed"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$NEEDS"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if ! jq -e --argjson expected "$expected" \
            '(keys | sort) == $expected and length == ($expected | length) and all(.[]; .result == "success")' \
            <<<"$NEEDS" >/dev/null; then
            echo "::error::CI failed: every job in $expected must be needed and succeed"
            exit 1
          fi

  desktop_release_build:
    name: Desktop Release Build ${{ matrix.label }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
          - label: macOS x64
            runner: macos-15-intel
            platform: mac
            target: dmg
            arch: x64
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
          - label: Windows x64
            runner: windows-2022
            platform: win
            target: nsis
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - id: setup
        name: Setup Bun, Node, Electron cache and dependencies
        uses: ./.github/actions/setup-bigbud
        with:
          # The Linux CI jobs already validate install-time scripts. The
          # release-style build matrix only needs dependencies on disk, and
          # skipping lifecycle scripts avoids a Windows-only effect-language-
          # service patch crash.
          install: ignore-scripts

      - name: Build desktop artifact
        shell: bash
        run: |
          bun run dist:desktop:artifact -- \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --build-version "0.0.0-preview.${{ github.run_number }}" \
            --verbose

      # Every target builds for its runner's own OS and architecture, which the cache key encodes.
      - name: Save Electron cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.electron-cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/electron-cache
          key: ${{ steps.setup.outputs.electron-cache-key }}

      - name: Smoke test packaged workspace watcher
        run: node scripts/verify-packaged-workspace-agent.ts release "${{ matrix.platform }}" "${{ matrix.arch }}" release-publish

      - name: Smoke test packaged delivery supervisor
        run: bun run verify:packaged-desktop-supervisor -- release "${{ matrix.platform }}"

      - name: Smoke test Windows installer update over a running helper
        if: matrix.platform == 'win'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/nsis-update-smoke.ps1 -ReleaseDir release

      - name: Build Linux .deb fallback
        if: matrix.platform == 'linux'
        run: >-
          bun run dist:desktop:artifact -- --platform linux --target deb --arch x64
          --build-version "0.0.0-preview.${{ github.run_number }}" --output-dir release-deb
          --skip-build --verbose && cp release-deb/*.deb release/

      - name: Collect release-style artifacts
        run: >-
          node scripts/collect-desktop-release-assets.ts release release-publish
          "${{ matrix.platform }}" "${{ matrix.arch }}" preview

      - name: Upload release-style artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-release-assets-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  workspace_agent_windows_arm64:
    name: Build Windows ARM64 server workspace agent
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.95.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
      - name: Install protobuf compiler
        run: choco install protoc --yes --no-progress
      - name: Build and test read-only native helper
        env:
          BIGBUD_AGENT_BUILD_VERSION: 0.0.0-preview.${{ github.run_number }}
          BIGBUD_AGENT_BUILD_DIGEST: ${{ github.sha }}
        run: |
          cargo test --locked --package bigbud-remote-agent --test inspect_local
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --package bigbud-remote-agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --package bigbud-desktop-supervisor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage native server artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-publish | Out-Null
          Copy-Item target/release/bigbud-desktop-supervisor.exe release-publish/server-organization-supervisor-win32-arm64.exe
          node --input-type=module -e "import { smokeTestThreadOrganizationBinary } from './scripts/lib/thread-organization-smoke.ts'; await smokeTestThreadOrganizationBinary('./release-publish/server-organization-supervisor-win32-arm64.exe');"
          if ($LASTEXITCODE -ne 0) { throw 'Organisation supervisor smoke failed' }
          Copy-Item target/release/bigbud-remote-agent.exe release-publish/server-workspace-agent-win32-arm64.exe
          $identity = & release-publish/server-workspace-agent-win32-arm64.exe --check
          if ($LASTEXITCODE -ne 0 -or $identity -notmatch 'windows\s+aarch64$') { throw 'Native ARM64 identity mismatch' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-release-assets-workspace-agent-win32-arm64
          path: release-publish/*
          if-no-files-found: error

  workspace_agent_linux_arm64:
    name: Build Linux ARM64 server workspace agent
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.95.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
      - name: Build native server helpers
        env:
          BIGBUD_AGENT_BUILD_VERSION: 0.0.0-preview.${{ github.run_number }}
          BIGBUD_AGENT_BUILD_DIGEST: ${{ github.sha }}
        run: |
          cargo build --locked --release --package bigbud-remote-agent
          cargo build --locked --release --package bigbud-desktop-supervisor
      - name: Stage native server artifact
        run: |
          mkdir -p release-publish
          cp target/release/bigbud-desktop-supervisor release-publish/server-organization-supervisor-linux-arm64
          node --input-type=module -e "import { smokeTestThreadOrganizationBinary } from './scripts/lib/thread-organization-smoke.ts'; await smokeTestThreadOrganizationBinary('./release-publish/server-organization-supervisor-linux-arm64');"
          cp target/release/bigbud-remote-agent release-publish/server-workspace-agent-linux-arm64
          identity="$(release-publish/server-workspace-agent-linux-arm64 --check)"
          if ! printf '%s\n' "$identity" | grep -Eq 'linux[[:space:]]+aarch64$'; then
            echo "Native ARM64 identity mismatch: $identity" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-release-assets-workspace-agent-linux-arm64
          path: release-publish/*
          if-no-files-found: error

  release_asset_assembly:
    name: Release Asset Assembly
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Builds start immediately; only assembly waits for the verdict (release_smoke is part of it).
    needs:
      [ci_passed, desktop_release_build, workspace_agent_windows_arm64, workspace_agent_linux_arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json

      - name: Download all desktop artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-release-assets-*
          merge-multiple: true
          path: release-assets

      - name: Stage bootstrap installers
        run: |
          cp apps/marketing/public/install.sh release-assets/install.sh
          cp apps/marketing/public/install.ps1 release-assets/install.ps1

      - name: Merge macOS updater manifests
        run: |
          node scripts/merge-mac-update-manifests.ts \
            release-assets/preview-mac.yml \
            release-assets/preview-mac-x64.yml
          rm -f release-assets/preview-mac-x64.yml

      - name: Verify assembled release payload
        run: node scripts/verify-desktop-release-assets.ts release-assets preview

      - name: Upload assembled release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-release-assembled
          path: release-assets/*
          if-no-files-found: error
