name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Format, Lint, Typecheck, Test, Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler

      - name: Cache Bun and Turbo
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-${{ hashFiles('turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run fmt:check

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Rust test
        run: cargo test --locked --workspace

      - name: Rust binary build
        run: cargo build --locked --workspace --release

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build desktop pipeline
        run: bun run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.js
          grep -nE "desktopBridge|getWsUrl|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.js

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

      - name: Validate bootstrap installer scripts
        run: node scripts/bootstrap-installer-smoke.ts

  bootstrap_installer_smoke:
    name: Bootstrap Installer Smoke
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate install.ps1 with mocked cmdlets
        shell: pwsh
        run: pwsh -File scripts/bootstrap-installer-smoke.ps1

  desktop_release_build:
    name: Desktop Release Build ${{ matrix.label }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-14
            platform: mac
            target: dmg
            arch: arm64
          - label: macOS x64
            runner: macos-15-intel
            platform: mac
            target: dmg
            arch: x64
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
          - label: Windows x64
            runner: windows-2022
            platform: win
            target: nsis
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        # The Linux quality job already validates install-time scripts. The
        # release-style build matrix only needs dependencies on disk, and
        # skipping lifecycle scripts avoids a Windows-only effect-language-
        # service patch crash.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build desktop artifact
        shell: bash
        run: |
          bun run dist:desktop:artifact -- \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --build-version "0.0.0-preview.${{ github.run_number }}" \
            --verbose

      - name: Smoke test packaged workspace watcher
        run: node scripts/verify-packaged-workspace-agent.ts release "${{ matrix.platform }}" "${{ matrix.arch }}" release-publish

      - name: Smoke test packaged delivery supervisor
        run: bun run verify:packaged-desktop-supervisor -- release "${{ matrix.platform }}"

      - name: Build Linux .deb fallback
        if: matrix.platform == 'linux'
        run: >-
          bun run dist:desktop:artifact -- --platform linux --target deb --arch x64
          --build-version "0.0.0-preview.${{ github.run_number }}" --output-dir release-deb
          --skip-build --verbose && cp release-deb/*.deb release/

      - name: Collect release-style artifacts
        run: >-
          node scripts/collect-desktop-release-assets.ts release release-publish
          "${{ matrix.platform }}" "${{ matrix.arch }}" preview

      - name: Upload release-style artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-assets-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  release_asset_assembly:
    name: Release Asset Assembly
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [desktop_release_build, release_smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-release-assets-*
          merge-multiple: true
          path: release-assets

      - name: Stage bootstrap installers
        run: |
          cp apps/marketing/public/install.sh release-assets/install.sh
          cp apps/marketing/public/install.ps1 release-assets/install.ps1

      - name: Merge macOS updater manifests
        run: |
          node scripts/merge-mac-update-manifests.ts \
            release-assets/preview-mac.yml \
            release-assets/preview-mac-x64.yml
          rm -f release-assets/preview-mac-x64.yml

      - name: Verify assembled release payload
        run: node scripts/verify-desktop-release-assets.ts release-assets preview

      - name: Upload assembled release payload
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-assembled
          path: release-assets/*
          if-no-files-found: error
