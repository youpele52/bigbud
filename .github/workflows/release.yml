name: Release Desktop And Remote Agent

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.2.3 or v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      update_channel: ${{ steps.release_meta.outputs.update_channel }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      ref: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler

      - id: release_meta
        name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw="${{ github.event.inputs.version }}"
          else
            raw="${GITHUB_REF_NAME}"
          fi
          bun scripts/resolve-release-metadata.ts "$raw" --github-output "$GITHUB_OUTPUT"

      - name: Format
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Rust test
        run: cargo test --locked --workspace

      - name: Test
        run: bun run test

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-14
            platform: mac
            target: dmg
            arch: arm64
          - label: macOS x64
            runner: macos-15-intel
            platform: mac
            target: dmg
            arch: x64
          - label: Linux x64
            runner: ubuntu-22.04
            platform: linux
            target: AppImage
            arch: x64
          - label: Windows x64
            runner: windows-2022
            platform: win
            target: nsis
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Validate macOS signing credentials
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required macOS signing secret: $name" >&2
              exit 1
            fi
          done

      - name: Import code signing certificates
        if: matrix.platform == 'mac'
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build desktop artifact
        shell: bash
        env:
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.preflight.outputs.version }}"
            --verbose
          )

          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            echo "macOS signing and notarization are required."
            args+=(--signed)
          elif [[ "${{ matrix.platform }}" == "win" ]]; then
            echo "Windows artifacts are intentionally unsigned."
          else
            echo "Linux artifacts do not use OS code signing."
          fi

          bun run dist:desktop:artifact -- "${args[@]}"

      - name: Smoke test packaged workspace watcher
        shell: bash
        run: |
          args=(release "${{ matrix.platform }}" "${{ matrix.arch }}" release-publish)
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            args+=(--require-code-signature)
          fi
          node scripts/verify-packaged-workspace-agent.ts "${args[@]}"

      - name: Build Linux .deb fallback
        if: matrix.platform == 'linux'
        run: >-
          bun run dist:desktop:artifact -- --platform linux --target deb --arch x64
          --build-version "${{ needs.preflight.outputs.version }}" --output-dir release-deb
          --skip-build --verbose && cp release-deb/*.deb release/

      - name: Verify Linux desktop artifact
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage_path=$(find release -maxdepth 1 -name '*.AppImage' | head -n 1)
          if [[ -z "$appimage_path" ]]; then
            echo "No .AppImage found in release/" >&2
            exit 1
          fi
          echo "Found AppImage: $appimage_path"
          chmod +x "$appimage_path"
          bun run verify:desktop:linux-artifact -- "$appimage_path" --verbose

      - name: Collect release assets
        run: >-
          node scripts/collect-desktop-release-assets.ts release release-publish
          "${{ matrix.platform }}" "${{ matrix.arch }}"
          "${{ needs.preflight.outputs.update_channel }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  remote_agent_build:
    name: Build remote agent ${{ matrix.label }}
    needs: preflight
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            target: x86_64-unknown-linux-gnu
            strip: strip
          - label: Linux arm64
            target: aarch64-unknown-linux-gnu
            strip: aarch64-linux-gnu-strip
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          packages=(protobuf-compiler)
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            packages+=(gcc-aarch64-linux-gnu)
          fi
          sudo apt-get update
          sudo apt-get install --yes "${packages[@]}"

      - name: Build remote agent
        shell: bash
        env:
          BIGBUD_AGENT_BUILD_VERSION: ${{ needs.preflight.outputs.version }}
          BIGBUD_AGENT_BUILD_DIGEST: ${{ github.sha }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --package bigbud-remote-agent --target "${{ matrix.target }}"

      - name: Prepare remote agent release asset
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.preflight.outputs.version }}'
          target='${{ matrix.target }}'
          asset_name="bigbud-remote-agent-${version}-${target}"
          mkdir -p release-publish
          cp "target/${target}/release/bigbud-remote-agent" "release-publish/${asset_name}"
          '${{ matrix.strip }}' "release-publish/${asset_name}"
          chmod 755 "release-publish/${asset_name}"
          (cd release-publish && sha256sum "${asset_name}" > "${asset_name}.sha256")

      - name: Upload remote agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-agent-${{ matrix.target }}
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [preflight, build, remote_agent_build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download all remote agent artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: remote-agent-*
          merge-multiple: true
          path: release-assets

      - name: Merge macOS updater manifests
        run: |
          node scripts/merge-mac-update-manifests.ts \
            "release-assets/${{ needs.preflight.outputs.update_channel }}-mac.yml" \
            "release-assets/${{ needs.preflight.outputs.update_channel }}-mac-x64.yml"
          rm -f "release-assets/${{ needs.preflight.outputs.update_channel }}-mac-x64.yml"

      - name: Stage bootstrap installers
        run: |
          cp apps/marketing/public/install.sh release-assets/install.sh
          cp apps/marketing/public/install.ps1 release-assets/install.ps1

      - name: Build signed remote agent manifest
        env:
          BIGBUD_REMOTE_AGENT_SIGNING_KEY: ${{ secrets.BIGBUD_REMOTE_AGENT_SIGNING_KEY }}
          BIGBUD_REMOTE_AGENT_SIGNING_KEY_ID: ${{ secrets.BIGBUD_REMOTE_AGENT_SIGNING_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.preflight.outputs.version }}'
          node scripts/build-remote-agent-release-manifest.ts \
            --version "$version" \
            --repository "$GITHUB_REPOSITORY" \
            --output release-assets/remote-agent-manifest.json \
            --install-source-output release-assets/remote-agent-install-source.json \
            --asset="x86_64-unknown-linux-gnu=release-assets/bigbud-remote-agent-${version}-x86_64-unknown-linux-gnu" \
            --asset="aarch64-unknown-linux-gnu=release-assets/bigbud-remote-agent-${version}-aarch64-unknown-linux-gnu"

      - name: Verify packaged remote agent assets
        env:
          BIGBUD_REMOTE_AGENT_SIGNING_KEY: ${{ secrets.BIGBUD_REMOTE_AGENT_SIGNING_KEY }}
          BIGBUD_REMOTE_AGENT_SIGNING_KEY_ID: ${{ secrets.BIGBUD_REMOTE_AGENT_SIGNING_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.preflight.outputs.version }}'
          node scripts/verify-remote-agent-release-assets.ts \
            --manifest release-assets/remote-agent-manifest.json \
            --install-source release-assets/remote-agent-install-source.json \
            --asset="x86_64-unknown-linux-gnu=release-assets/bigbud-remote-agent-${version}-x86_64-unknown-linux-gnu" \
            --asset="aarch64-unknown-linux-gnu=release-assets/bigbud-remote-agent-${version}-aarch64-unknown-linux-gnu"

      - name: Verify assembled release payload
        run: >-
          node scripts/verify-desktop-release-assets.ts release-assets
          "${{ needs.preflight.outputs.update_channel }}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: bigbud v${{ needs.preflight.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/${{ needs.preflight.outputs.update_channel }}*.yml
            release-assets/install.sh
            release-assets/install.ps1
            release-assets/bigbud-remote-agent-*
            release-assets/remote-agent-install-source.json
            release-assets/remote-agent-manifest.json
            release-assets/server-workspace-agent-*
          fail_on_unmatched_files: true
