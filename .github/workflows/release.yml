name: Release Desktop And Remote Agent

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.2.3 or v1.2.3)"
        required: true
        type: string
      publish:
        description: "Publish the GitHub release (otherwise a dry run that builds and verifies only)"
        required: false
        type: boolean
        default: false

# Least privilege: only the publish job gets contents: write, and only ci_gate reads Actions.
# No concurrency key: nothing may cancel a release run.
permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      update_channel: ${{ steps.release_meta.outputs.update_channel }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      ref: ${{ github.sha }}
      # Unpublished dry-run artifacts are signed builds in a public repository: keep them briefly.
      # 0 keeps the repository default.
      artifact_retention_days: ${{ github.event_name == 'workflow_dispatch' && inputs.publish != true && 3 || 0 }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json

      # Metadata needs only @bigbud/shared. The test suite is not re-run here: ci_gate requires
      # `CI passed` for this exact commit before publish.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - id: release_meta
        name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw="${{ github.event.inputs.version }}"
          else
            raw="${GITHUB_REF_NAME}"
          fi
          bun scripts/resolve-release-metadata.ts "$raw" --github-output "$GITHUB_OUTPUT"

  ci_gate:
    name: CI passed for release commit
    needs: preflight
    runs-on: ubuntu-24.04
    # The script polls for up to 70 minutes.
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json

      - name: Assert the checkout is the release commit
        env:
          RELEASE_SHA: ${{ needs.preflight.outputs.ref }}
        run: |
          head="$(git rev-parse HEAD)"
          if [[ "$head" != "$RELEASE_SHA" ]]; then
            echo "::error::Checked out $head but the release commit is $RELEASE_SHA"; exit 1
          fi

      # Node built-ins only, so no dependency install (the Bun script ci:wait-for-verdict runs the same file).
      - name: Wait for CI passed on the release commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.preflight.outputs.ref }}
        run: >-
          node scripts/wait-for-ci-verdict.ts --repo "$GITHUB_REPOSITORY" --sha "$RELEASE_SHA"
          --workflow ci.yml --job "CI passed" --timeout-minutes 70 --missing-grace-minutes 10
          --poll-seconds 30

  native_resource_cleanup:
    name: Native Resource Cleanup ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
          - label: macOS x64
            runner: macos-15-intel
          - label: Linux x64
            runner: ubuntu-24.04
          - label: Linux arm64
            runner: ubuntu-24.04-arm
          - label: Windows x64
            runner: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.95.0
      - name: Run native cleanup tests
        run: cargo test --locked --package bigbud-remote-agent resource_cleanup

  native_resource_cleanup_mount:
    name: Native Resource Cleanup Linux Mount Boundary
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.95.0
      - name: Run privileged mount-boundary cleanup test
        run: cargo test --locked --package bigbud-remote-agent refuses_a_same_device_bind_mount_boundary -- --ignored

  # Builds never wait for tests or cleanup; only publish waits (for ci_gate and everything else).
  build:
    needs: [preflight]
    uses: ./.github/workflows/release-desktop-build.yml
    with:
      ref: ${{ needs.preflight.outputs.ref }}
      version: ${{ needs.preflight.outputs.version }}
      tag: ${{ needs.preflight.outputs.tag }}
      update_channel: ${{ needs.preflight.outputs.update_channel }}
      retention_days: ${{ fromJSON(needs.preflight.outputs.artifact_retention_days) }}
    secrets: inherit

  remote_agent_build:
    needs: preflight
    uses: ./.github/workflows/release-remote-agent-build.yml
    with:
      ref: ${{ needs.preflight.outputs.ref }}
      version: ${{ needs.preflight.outputs.version }}
      retention_days: ${{ fromJSON(needs.preflight.outputs.artifact_retention_days) }}

  remote_backend_graph_build:
    needs: preflight
    uses: ./.github/workflows/release-remote-backend-graph.yml
    with:
      ref: ${{ needs.preflight.outputs.ref }}
      version: ${{ needs.preflight.outputs.version }}
      release_signing: true
      retention_days: ${{ fromJSON(needs.preflight.outputs.artifact_retention_days) }}
    secrets:
      BIGBUD_REMOTE_AGENT_SIGNING_KEY: ${{ secrets.BIGBUD_REMOTE_AGENT_SIGNING_KEY }}
      BIGBUD_REMOTE_AGENT_SIGNING_KEY_ID: ${{ secrets.BIGBUD_REMOTE_AGENT_SIGNING_KEY_ID }}

  workspace_agent_windows_arm64:
    name: Build Windows ARM64 server workspace agent
    needs: preflight
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.95.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
      - name: Install protobuf compiler
        run: choco install protoc --yes --no-progress
      - name: Build and test read-only native helper
        env:
          BIGBUD_AGENT_BUILD_VERSION: ${{ needs.preflight.outputs.version }}
          BIGBUD_AGENT_BUILD_DIGEST: ${{ github.sha }}
        run: |
          cargo test --locked --package bigbud-remote-agent --test inspect_local
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --package bigbud-remote-agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --package bigbud-desktop-supervisor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage native server artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-publish | Out-Null
          Copy-Item target/release/bigbud-desktop-supervisor.exe release-publish/server-organization-supervisor-win32-arm64.exe
          node --input-type=module -e "import { smokeTestThreadOrganizationBinary } from './scripts/lib/thread-organization-smoke.ts'; await smokeTestThreadOrganizationBinary('./release-publish/server-organization-supervisor-win32-arm64.exe');"
          if ($LASTEXITCODE -ne 0) { throw 'Organisation supervisor smoke failed' }
          Copy-Item target/release/bigbud-remote-agent.exe release-publish/server-workspace-agent-win32-arm64.exe
          $identity = & release-publish/server-workspace-agent-win32-arm64.exe --check
          if ($LASTEXITCODE -ne 0 -or $identity -notmatch 'windows\s+aarch64$') { throw 'Native ARM64 identity mismatch' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-workspace-agent-win32-arm64
          path: release-publish/*
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.preflight.outputs.artifact_retention_days) }}

  workspace_agent_linux_arm64:
    name: Build Linux ARM64 server workspace agent
    needs: preflight
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.95.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
      - name: Build native server helpers
        env:
          BIGBUD_AGENT_BUILD_VERSION: ${{ needs.preflight.outputs.version }}
          BIGBUD_AGENT_BUILD_DIGEST: ${{ github.sha }}
        run: |
          cargo build --locked --release --package bigbud-remote-agent
          cargo build --locked --release --package bigbud-desktop-supervisor
      - name: Stage native server artifact
        run: |
          mkdir -p release-publish
          cp target/release/bigbud-desktop-supervisor release-publish/server-organization-supervisor-linux-arm64
          node --input-type=module -e "import { smokeTestThreadOrganizationBinary } from './scripts/lib/thread-organization-smoke.ts'; await smokeTestThreadOrganizationBinary('./release-publish/server-organization-supervisor-linux-arm64');"
          cp target/release/bigbud-remote-agent release-publish/server-workspace-agent-linux-arm64
          identity="$(release-publish/server-workspace-agent-linux-arm64 --check)"
          if ! printf '%s\n' "$identity" | grep -Eq 'linux[[:space:]]+aarch64$'; then
            echo "Native ARM64 identity mismatch: $identity" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-workspace-agent-linux-arm64
          path: release-publish/*
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.preflight.outputs.artifact_retention_days) }}

  release:
    name: Publish GitHub Release
    needs:
      - preflight
      - ci_gate
      - native_resource_cleanup
      - native_resource_cleanup_mount
      - build
      - remote_agent_build
      - remote_backend_graph_build
      - workspace_agent_windows_arm64
      - workspace_agent_linux_arm64
    # Tag pushes publish; a manual dispatch publishes only with an explicit publish: true.
    if: ${{ github.event_name == 'push' || inputs.publish == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download all desktop artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Download all remote agent artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: remote-agent-*
          merge-multiple: true
          path: release-assets
      - name: Download all remote backend graph artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: remote-backend-graph-*
          merge-multiple: true
          path: release-assets

      - name: Merge macOS updater manifests
        run: |
          node scripts/merge-mac-update-manifests.ts \
            "release-assets/${{ needs.preflight.outputs.update_channel }}-mac.yml" \
            "release-assets/${{ needs.preflight.outputs.update_channel }}-mac-x64.yml"
          rm -f "release-assets/${{ needs.preflight.outputs.update_channel }}-mac-x64.yml"

      - name: Stage bootstrap installers
        run: |
          cp apps/marketing/public/install.sh release-assets/install.sh
          cp apps/marketing/public/install.ps1 release-assets/install.ps1
          cp apps/marketing/public/remote-agent.sh release-assets/remote-agent.sh

      - name: Build signed remote agent manifests
        env:
          BIGBUD_REMOTE_AGENT_SIGNING_KEY: ${{ secrets.BIGBUD_REMOTE_AGENT_SIGNING_KEY }}
          BIGBUD_REMOTE_AGENT_SIGNING_KEY_ID: ${{ secrets.BIGBUD_REMOTE_AGENT_SIGNING_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.preflight.outputs.version }}'
          asset() { printf -- '--asset=%s=release-assets/bigbud-remote-agent-%s-%s' "$1" "$version" "$1"; }
          common=(--version "$version" --tag "${{ needs.preflight.outputs.tag }}"
            --build-digest "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY")
          # Legacy names stay glibc-only: older clients reject manifests with unknown triples.
          node scripts/build-remote-agent-release-manifest.ts "${common[@]}" \
            --output release-assets/remote-agent-manifest.json \
            --install-source-output release-assets/remote-agent-install-source.json \
            "$(asset x86_64-unknown-linux-gnu)" "$(asset aarch64-unknown-linux-gnu)"
          # Musl-aware clients read v2 and prefer the static builds.
          node scripts/build-remote-agent-release-manifest.ts "${common[@]}" \
            --output release-assets/remote-agent-manifest.v2.json \
            --install-source-output release-assets/remote-agent-install-source.v2.json \
            "$(asset x86_64-unknown-linux-musl)" "$(asset aarch64-unknown-linux-musl)" \
            "$(asset x86_64-unknown-linux-gnu)" "$(asset aarch64-unknown-linux-gnu)"

      - name: Verify packaged remote agent assets
        env:
          BIGBUD_REMOTE_AGENT_SIGNING_KEY: ${{ secrets.BIGBUD_REMOTE_AGENT_SIGNING_KEY }}
          BIGBUD_REMOTE_AGENT_SIGNING_KEY_ID: ${{ secrets.BIGBUD_REMOTE_AGENT_SIGNING_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.preflight.outputs.version }}'
          asset() { printf -- '--asset=%s=release-assets/bigbud-remote-agent-%s-%s' "$1" "$version" "$1"; }
          node scripts/verify-remote-agent-release-assets.ts \
            --manifest release-assets/remote-agent-manifest.json \
            --install-source release-assets/remote-agent-install-source.json \
            "$(asset x86_64-unknown-linux-gnu)" "$(asset aarch64-unknown-linux-gnu)"
          node scripts/verify-remote-agent-release-assets.ts \
            --manifest release-assets/remote-agent-manifest.v2.json \
            --install-source release-assets/remote-agent-install-source.v2.json \
            "$(asset x86_64-unknown-linux-musl)" "$(asset aarch64-unknown-linux-musl)" \
            "$(asset x86_64-unknown-linux-gnu)" "$(asset aarch64-unknown-linux-gnu)"
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl \
            x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            for suffix in .THIRD_PARTY_NOTICES .licenses.json; do
              test -s "release-assets/bigbud-remote-agent-${version}-${target}${suffix}"
            done
          done

      - name: Verify remote backend graph assets
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.preflight.outputs.version }}'
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            prefix="bigbud-backend-graph-${version}-${target}"
            for suffix in .manifest.json .provenance.json; do
              test -f "release-assets/${prefix}${suffix}"
            done
            (cd release-assets && sha256sum --check "${prefix}.tar.gz.sha256")
          done
          if compgen -G 'release-assets/bigbud-backend-graph-*.fixture-public-key.pem' > /dev/null; then
            echo "::error::Release graph assets were signed with a CI fixture key"; exit 1
          fi

      - name: Verify assembled release payload
        run: >-
          node scripts/verify-desktop-release-assets.ts release-assets
          "${{ needs.preflight.outputs.update_channel }}"

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: bigbud v${{ needs.preflight.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/${{ needs.preflight.outputs.update_channel }}*.yml
            release-assets/install.sh
            release-assets/install.ps1
            release-assets/remote-agent.sh
            release-assets/bigbud-remote-agent-*
            release-assets/remote-agent-install-source.json
            release-assets/remote-agent-manifest.json
            release-assets/remote-agent-install-source.v2.json
            release-assets/remote-agent-manifest.v2.json
            release-assets/bigbud-backend-graph-*
            release-assets/server-workspace-agent-*
            release-assets/server-organization-supervisor-*
          fail_on_unmatched_files: true
