name: Release Desktop And Remote Agent

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.2.3 or v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      update_channel: ${{ steps.release_meta.outputs.update_channel }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      ref: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: node scripts/bun-install-with-retry.ts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler

      - id: release_meta
        name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw="${{ github.event.inputs.version }}"
          else
            raw="${GITHUB_REF_NAME}"
          fi
          bun scripts/resolve-release-metadata.ts "$raw" --github-output "$GITHUB_OUTPUT"

      - name: Format
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Rust test
        run: cargo test --locked --workspace

      - name: Install Playwright Chromium for server terminal browser tests
        run: bun run --cwd apps/server test:browser:install

      - name: Test
        run: bun run test

  native_resource_cleanup:
    name: Native Resource Cleanup ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
          - label: macOS x64
            runner: macos-15-intel
          - label: Linux x64
            runner: ubuntu-24.04
          - label: Windows x64
            runner: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: Run native cleanup tests
        run: cargo test --locked --package bigbud-remote-agent resource_cleanup

  native_resource_cleanup_mount:
    name: Native Resource Cleanup Linux Mount Boundary
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: Run privileged mount-boundary cleanup test
        run: cargo test --locked --package bigbud-remote-agent refuses_a_same_device_bind_mount_boundary -- --ignored

  build:
    needs: [preflight, native_resource_cleanup, native_resource_cleanup_mount]
    uses: ./.github/workflows/release-desktop-build.yml
    with:
      ref: ${{ needs.preflight.outputs.ref }}
      version: ${{ needs.preflight.outputs.version }}
      tag: ${{ needs.preflight.outputs.tag }}
      update_channel: ${{ needs.preflight.outputs.update_channel }}
    secrets: inherit

  remote_agent_build:
    name: Build remote agent ${{ matrix.label }}
    needs: preflight
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            target: x86_64-unknown-linux-gnu
            strip: strip
          - label: Linux arm64
            target: aarch64-unknown-linux-gnu
            strip: aarch64-linux-gnu-strip
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          packages=(protobuf-compiler)
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            packages+=(gcc-aarch64-linux-gnu)
          fi
          sudo apt-get update
          sudo apt-get install --yes "${packages[@]}"

      - name: Build remote agent
        shell: bash
        env:
          BIGBUD_AGENT_BUILD_VERSION: ${{ needs.preflight.outputs.version }}
          BIGBUD_AGENT_BUILD_DIGEST: ${{ github.sha }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --package bigbud-remote-agent --target "${{ matrix.target }}"

      - name: Prepare remote agent release asset
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.preflight.outputs.version }}'
          target='${{ matrix.target }}'
          asset_name="bigbud-remote-agent-${version}-${target}"
          mkdir -p release-publish
          cp "target/${target}/release/bigbud-remote-agent" "release-publish/${asset_name}"
          '${{ matrix.strip }}' "release-publish/${asset_name}"
          chmod 755 "release-publish/${asset_name}"
          (cd release-publish && sha256sum "${asset_name}" > "${asset_name}.sha256")

      - name: Upload remote agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-agent-${{ matrix.target }}
          path: release-publish/*
          if-no-files-found: error

  workspace_agent_windows_arm64:
    name: Build Windows ARM64 server workspace agent
    needs: preflight
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Install protobuf compiler
        run: choco install protoc --yes --no-progress
      - name: Build and test read-only native helper
        env:
          BIGBUD_AGENT_BUILD_VERSION: ${{ needs.preflight.outputs.version }}
          BIGBUD_AGENT_BUILD_DIGEST: ${{ github.sha }}
        run: |
          cargo test --locked --package bigbud-remote-agent --test inspect_local
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --package bigbud-remote-agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --package bigbud-desktop-supervisor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage native server artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-publish | Out-Null
          Copy-Item target/release/bigbud-desktop-supervisor.exe release-publish/server-organization-supervisor-win32-arm64.exe
          node --input-type=module -e "import { smokeTestThreadOrganizationBinary } from './scripts/lib/thread-organization-smoke.ts'; await smokeTestThreadOrganizationBinary('./release-publish/server-organization-supervisor-win32-arm64.exe');"
          if ($LASTEXITCODE -ne 0) { throw 'Organisation supervisor smoke failed' }
          Copy-Item target/release/bigbud-remote-agent.exe release-publish/server-workspace-agent-win32-arm64.exe
          $identity = & release-publish/server-workspace-agent-win32-arm64.exe --check
          if ($LASTEXITCODE -ne 0 -or $identity -notmatch 'windows\s+aarch64$') { throw 'Native ARM64 identity mismatch' }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-workspace-agent-win32-arm64
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [preflight, build, remote_agent_build, workspace_agent_windows_arm64]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download all desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Download all remote agent artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: remote-agent-*
          merge-multiple: true
          path: release-assets

      - name: Merge macOS updater manifests
        run: |
          node scripts/merge-mac-update-manifests.ts \
            "release-assets/${{ needs.preflight.outputs.update_channel }}-mac.yml" \
            "release-assets/${{ needs.preflight.outputs.update_channel }}-mac-x64.yml"
          rm -f "release-assets/${{ needs.preflight.outputs.update_channel }}-mac-x64.yml"

      - name: Stage bootstrap installers
        run: |
          cp apps/marketing/public/install.sh release-assets/install.sh
          cp apps/marketing/public/install.ps1 release-assets/install.ps1

      - name: Build signed remote agent manifest
        env:
          BIGBUD_REMOTE_AGENT_SIGNING_KEY: ${{ secrets.BIGBUD_REMOTE_AGENT_SIGNING_KEY }}
          BIGBUD_REMOTE_AGENT_SIGNING_KEY_ID: ${{ secrets.BIGBUD_REMOTE_AGENT_SIGNING_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.preflight.outputs.version }}'
          node scripts/build-remote-agent-release-manifest.ts \
             --version "$version" \
            --tag "${{ needs.preflight.outputs.tag }}" \
            --build-digest "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --output release-assets/remote-agent-manifest.json \
            --install-source-output release-assets/remote-agent-install-source.json \
            --asset="x86_64-unknown-linux-gnu=release-assets/bigbud-remote-agent-${version}-x86_64-unknown-linux-gnu" \
            --asset="aarch64-unknown-linux-gnu=release-assets/bigbud-remote-agent-${version}-aarch64-unknown-linux-gnu"

      - name: Verify packaged remote agent assets
        env:
          BIGBUD_REMOTE_AGENT_SIGNING_KEY: ${{ secrets.BIGBUD_REMOTE_AGENT_SIGNING_KEY }}
          BIGBUD_REMOTE_AGENT_SIGNING_KEY_ID: ${{ secrets.BIGBUD_REMOTE_AGENT_SIGNING_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.preflight.outputs.version }}'
          node scripts/verify-remote-agent-release-assets.ts \
            --manifest release-assets/remote-agent-manifest.json \
            --install-source release-assets/remote-agent-install-source.json \
            --asset="x86_64-unknown-linux-gnu=release-assets/bigbud-remote-agent-${version}-x86_64-unknown-linux-gnu" \
            --asset="aarch64-unknown-linux-gnu=release-assets/bigbud-remote-agent-${version}-aarch64-unknown-linux-gnu"

      - name: Verify assembled release payload
        run: >-
          node scripts/verify-desktop-release-assets.ts release-assets
          "${{ needs.preflight.outputs.update_channel }}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: bigbud v${{ needs.preflight.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/${{ needs.preflight.outputs.update_channel }}*.yml
            release-assets/install.sh
            release-assets/install.ps1
            release-assets/bigbud-remote-agent-*
            release-assets/remote-agent-install-source.json
            release-assets/remote-agent-manifest.json
            release-assets/server-workspace-agent-*
            release-assets/server-organization-supervisor-*
          fail_on_unmatched_files: true
