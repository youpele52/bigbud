name: Build desktop release artifacts

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      update_channel:
        required: true
        type: string
      retention_days:
        description: "Artifact retention in days for the release payload (0 keeps the repository default; dry runs pass 3)"
        required: false
        type: number
        default: 0

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
          # Cross-built on Apple Silicon (guarded by the Rust target, Rosetta and architecture audit
          # steps). The native Intel cleanup tests in release.yml stay on macos-15-intel.
          - label: macOS x64
            runner: macos-15
            platform: mac
            target: dmg
            arch: x64
          - label: Linux x64
            runner: ubuntu-22.04
            platform: linux
            target: AppImage
            arch: x64
          - label: Windows x64
            runner: windows-2022
            platform: win
            target: nsis
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json

      - name: Configure local Node headers for native dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          node_dir="$(dirname "$(dirname "$(node -p 'process.execPath')")")"
          if [[ ! -f "$node_dir/include/node/node.h" ]]; then
            echo "Node headers not found at $node_dir/include/node/node.h" >&2
            exit 1
          fi
          echo "npm_config_nodedir=$node_dir" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # rust-toolchain.toml uses the minimal profile, which has no x86_64 standard library.
      - name: Add Rust macOS x64 target
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          if [[ -z "$toolchain" ]]; then
            echo "::error::Could not read the Rust channel from rust-toolchain.toml"; exit 1
          fi
          rustup toolchain install "$toolchain" --profile minimal --target x86_64-apple-darwin
          if ! rustup target list --installed --toolchain "$toolchain" | grep -qx x86_64-apple-darwin; then
            echo "::error::x86_64-apple-darwin is not installed for Rust $toolchain"; exit 1
          fi

      # Packaging runs the x64 helpers (--check, handshakes, smoke tests), so they need Rosetta 2.
      - name: Ensure Rosetta 2 for x64 smoke tests
        if: matrix.platform == 'mac' && matrix.arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          if ! arch -x86_64 /usr/bin/true; then
            echo "::error::Rosetta 2 is unavailable, so the x64 helpers cannot be smoke-tested"; exit 1
          fi

      - name: Validate Windows CUA sweep native helper
        if: matrix.platform == 'win'
        # Seven helper calls, each bounded by the 180s production budget (cold compile + one retry).
        timeout-minutes: 30
        run: bun run --cwd apps/desktop vitest run src/backend/cuaDriver.windowsSweep.native.test.ts

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ inputs.tag }}"

      - name: Validate macOS signing credentials
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required macOS signing secret: $name" >&2
              exit 1
            fi
          done

      - id: windows_signing
        name: Resolve Windows signing mode
        if: matrix.platform == 'win'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          BIGBUD_WINDOWS_SIGNING_SUBJECT: ${{ vars.BIGBUD_WINDOWS_SIGNING_SUBJECT }}
        run: |
          set -euo pipefail
          bun scripts/resolve-windows-signing-mode.ts

      - name: Import code signing certificates
        if: matrix.platform == 'mac'
        uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93 # v2
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build desktop artifact
        shell: bash
        env:
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          BIGBUD_WINDOWS_SIGNING_SUBJECT: ${{ matrix.platform == 'win' && vars.BIGBUD_WINDOWS_SIGNING_SUBJECT || '' }}
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ inputs.version }}"
            --verbose
          )

          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            echo "macOS signing and notarization are required."
            ulimit -n 65536
            echo "macOS build open-file limit: $(ulimit -n)"
            args+=(--signed)
          elif [[ "${{ matrix.platform }}" == "win" ]]; then
            if [[ "${{ steps.windows_signing.outputs.signed }}" == "true" ]]; then
              echo "Windows Authenticode signing is enabled."
              args+=(--signed)
            else
              echo "Building unsigned Windows artifacts."
            fi
          else
            echo "Linux artifacts do not use OS code signing."
          fi

          bun run dist:desktop:artifact -- "${args[@]}"

      - name: Preserve signed macOS app on notarization failure
        if: failure() && matrix.platform == 'mac'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notarization-recovery-${{ matrix.arch }}-${{ github.run_attempt }}
          path: notarization-recovery/
          retention-days: 3
          if-no-files-found: ignore

      - name: Audit packaged macOS app architectures
        if: matrix.platform == 'mac'
        run: bun run verify:desktop:mac-architecture -- release "${{ matrix.arch }}"

      - name: Smoke test packaged workspace watcher
        shell: bash
        env:
          BIGBUD_WINDOWS_SIGNING_SUBJECT: ${{ vars.BIGBUD_WINDOWS_SIGNING_SUBJECT }}
        run: |
          args=(release "${{ matrix.platform }}" "${{ matrix.arch }}" release-publish)
          if [[ "${{ matrix.platform }}" == "mac" || "${{ steps.windows_signing.outputs.signed }}" == "true" ]]; then
            args+=(--require-code-signature)
          fi
          node scripts/verify-packaged-workspace-agent.ts "${args[@]}"

      - name: Smoke test packaged delivery supervisor
        shell: bash
        env:
          BIGBUD_WINDOWS_SIGNING_SUBJECT: ${{ vars.BIGBUD_WINDOWS_SIGNING_SUBJECT }}
        run: |
          args=(release "${{ matrix.platform }}")
          if [[ "${{ matrix.platform }}" == "mac" || "${{ steps.windows_signing.outputs.signed }}" == "true" ]]; then
            args+=(--require-code-signature)
          fi
          bun run verify:packaged-desktop-supervisor -- "${args[@]}"

      # U4: every desktop cell (macOS arm64/x64, Linux x64, Windows x64) packages the owner, and the
      # verified copy in release-publish becomes the standalone N asset (server-ssh-owner-*).
      - name: Verify packaged SSH owner without activation
        shell: bash
        env:
          BIGBUD_WINDOWS_SIGNING_SUBJECT: ${{ vars.BIGBUD_WINDOWS_SIGNING_SUBJECT }}
        run: |
          set -euo pipefail
          args=(release "${{ matrix.platform }}" "${{ matrix.arch }}" release-publish)
          if [[ "${{ matrix.platform }}" == "mac" || "${{ steps.windows_signing.outputs.signed }}" == "true" ]]; then
            args+=(--require-code-signature)
          fi
          node scripts/verify-packaged-ssh-owner.ts "${args[@]}"

      - name: Smoke test Windows installer update over a running helper
        if: matrix.platform == 'win'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/nsis-update-smoke.ps1 -ReleaseDir release

      - name: Build Linux .deb fallback
        if: matrix.platform == 'linux'
        run: >-
          bun run dist:desktop:artifact -- --platform linux --target deb --arch x64
          --build-version "${{ inputs.version }}" --output-dir release-deb
          --skip-build --verbose && cp release-deb/*.deb release/

      - name: Verify Linux desktop artifact
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage_path=$(find release -maxdepth 1 -name '*.AppImage' | head -n 1)
          if [[ -z "$appimage_path" ]]; then
            echo "No .AppImage found in release/" >&2
            exit 1
          fi
          echo "Found AppImage: $appimage_path"
          chmod +x "$appimage_path"
          bun run verify:desktop:linux-artifact -- "$appimage_path" --verbose

      - name: Collect release assets
        run: >-
          node scripts/collect-desktop-release-assets.ts release release-publish
          "${{ matrix.platform }}" "${{ matrix.arch }}"
          "${{ inputs.update_channel }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || 0 }}
