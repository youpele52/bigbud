name: Set up Rust native toolchain
description: >-
  Install the pinned Rust toolchain and the protobuf compiler needed by the workspace crates.
  Linux runners only (protoc comes from apt).

inputs:
  components:
    description: "Extra rustup components, comma separated (for example 'rustfmt, clippy')"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Require a Linux runner
      if: runner.os != 'Linux'
      shell: bash
      run: |
        echo "::error::setup-rust-native installs protoc with apt and supports Linux runners only"
        exit 1

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      with:
        toolchain: 1.95.0
        components: ${{ inputs.components }}

    - name: Install protobuf compiler
      shell: bash
      run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
