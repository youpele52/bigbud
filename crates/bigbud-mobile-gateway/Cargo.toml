[package]
name = "bigbud-mobile-gateway"
description = "Optional narrow mobile entry point behind Tailscale Serve for bigbud"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "bigbud_mobile_gateway"
path = "src/lib.rs"

[[bin]]
name = "bigbud-mobile-gateway"
path = "src/main.rs"

# Maintained HTTP/WebSocket stack, approved for this crate on 13 November 2026.
# All default features are off: no TLS (Tailscale Serve terminates it), HTTP/1
# only. Used only by this crate, so versions live here rather than in
# [workspace.dependencies].
[dependencies]
bytes = "1.11"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1.3"
hyper = { version = "1.11", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
thiserror.workspace = true
tokio = { version = "1.52", default-features = false, features = ["rt", "net", "time", "io-util", "sync", "fs", "macros"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[dev-dependencies]
tokio = { version = "1.52", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "io-util", "sync", "fs", "macros"] }
# Test clients only: `connect` adds the URL-based client helpers.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake", "connect"] }

[lints]
workspace = true
