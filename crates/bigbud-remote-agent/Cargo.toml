[package]
name = "bigbud-remote-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
bigbud-protocol = { path = "../bigbud-protocol" }
bigbud-workspace-watch = { path = "../bigbud-workspace-watch" }
# ripgrep's library crates back workspace search (approved; see the system-wide search plan).
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = { version = "0.1.17", default-features = false }
ignore = "0.4.34"
sha2.workspace = true
serde_json.workspace = true
serde_core.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Spotlight (`MDQuery`) backs the local "this computer" search (approved; see the system-wide search plan).
# `objc2-core-foundation` is already locked through `sysinfo`; it supplies the CFString, CFArray,
# CFNumber, CFDate and CFRunLoop types the MDQuery bindings take and return.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFArray",
  "CFDate",
  "CFNumber",
  "CFRunLoop",
  "CFString",
] }
objc2-core-services = { version = "0.3.2", default-features = false, features = [
  "std",
  "MDItem",
  "MDQuery",
  "Metadata",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_WindowsProgramming",
  "Win32_System_Threading",
  "Win32_Security_Authorization",
] }

[lints]
workspace = true
